# Codemagic CI: builds the Inforedz iPhone app and uploads it to TestFlight.
# Same setup as InfuMedz; Android is still built and released locally.
#
# One-time setup in the Codemagic web UI:
#   - Team -> Integrations -> Developer Portal: the App Store Connect API key,
#     saved under the name used in `integrations` below (shared with InfuMedz).
#   - Team -> codemagic.yaml settings -> Code signing identities: the Apple
#     Distribution certificate (shared) and the App Store provisioning profile
#     for com.inforedz.app (fetch it there).
#
# Start a build from the Codemagic dashboard: Start new build -> branch
# ios-release-blockers (or main once merged) -> workflow
# "Inforedz iOS release to TestFlight" (signed IPA uploaded to TestFlight) or
# "Inforedz iOS simulator preview" (zip to try in a browser, no upload).

workflows:
  inforedz-ios-release:
    name: Inforedz iOS release to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the name given to the API key in Codemagic exactly.
      app_store_connect: InfuMedz App Store Connect

    environment:
      # Same Flutter as local development, so CI builds what was tested.
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inforedz.app
      vars:
        BUNDLE_ID: com.inforedz.app
        # InfoREDZ in App Store Connect (General -> App Information -> Apple ID).
        APP_STORE_APPLE_ID: 6761141438

    scripts:
      - name: Apply the code signing profile to the Xcode project
        script: xcode-project use-profiles

      # `flutter pub get` (not `flutter packages pub get`) also writes
      # ios/Flutter/Generated.xcconfig, which the Podfile needs.
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: cd ios && pod install --repo-update

      # No analyze/test step yet: the app still has old analyzer warnings and
      # test/widget_test.dart is the unused Flutter template test.

      - name: Build the IPA
        script: |
          # iOS build numbers only have to go up. Use one above the highest
          # number App Store Connect has seen (TestFlight or App Store). If the
          # lookup fails, use a UTC timestamp (yyMMddHHmm), which is always
          # higher, rather than risk re-using a number and failing the upload.
          # The version name comes from pubspec.yaml.
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$TF" in ''|*[!0-9]*) TF=0 ;; esac
          case "$AS" in ''|*[!0-9]*) AS=0 ;; esac
          LATEST=$(( TF > AS ? TF : AS ))
          if [ "$LATEST" -gt 0 ]; then
            BUILD=$(( LATEST + 1 ))
          else
            BUILD=$(date -u +%y%m%d%H%M)
          fi
          echo "Latest TestFlight build: $TF, latest App Store build: $AS -> building $BUILD"
          flutter build ipa --release \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - chandrasekharsuragani532@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Uploads to TestFlight (internal testers). Submitting for App Review
        # stays a manual step in App Store Connect.
        submit_to_testflight: false

  # Builds the app for the iOS *simulator*, to try it in a browser before an
  # iPhone is available: upload Inforedz-simulator.zip to appetize.io, or use
  # Codemagic's App Preview (teams on a paid plan only).
  #
  # Good for checking screens, sign-up/login, lists, profile and the map.
  # Calls, SMS and WhatsApp buttons can't open in a simulator, and GPS is a
  # fixed simulated location. No code signing or upload happens here.
  inforedz-ios-simulator:
    name: Inforedz iOS simulator preview
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: cd ios && pod install --repo-update

      - name: Build for the simulator
        script: |
          # Flutter only builds debug for the simulator; it still runs on its
          # own without a debugger attached.
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -qr Inforedz-simulator.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - build/ios/iphonesimulator/Inforedz-simulator.zip

    publishing:
      email:
        recipients:
          - chandrasekharsuragani532@gmail.com
        notify:
          success: true
          failure: true
