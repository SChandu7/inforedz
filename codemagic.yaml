workflows:
  ios-release:
    name: iOS Release - Inforedz
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inforedz.app
      # Secrets live in the Codemagic UI (environment variable group), never in this file:
      # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.inforedz.app"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Pod install
        script: cd ios && pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      # Version and build number come from pubspec.yaml (version: x.y.z+N).
      # Bump N before every upload; App Store Connect rejects a repeated build number.
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
